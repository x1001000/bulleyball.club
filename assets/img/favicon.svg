<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- A volleyball read as a court. The 18 m court is 6 m back zone, two
       3 m zones meeting at the net, 6 m back zone: out is the middle third.
       Same three bands a Mikasa wears, with orange in place of the blue.
       One fixed palette — the mark does not follow the theme. -->
  <rect x="0" y="0" width="16" height="16" fill="#ef5f24"/>
  <rect x="2" y="2" width="12" height="4" fill="#ffffff"/>
  <rect x="2" y="6" width="12" height="4" fill="#ffc02b"/>
  <rect x="2" y="10" width="12" height="4" fill="#ffffff"/>
</svg>
