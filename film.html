<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Bulleyball — rule film</title>
<style>
  @font-face { font-family: "Cap"; font-weight: 900; src: url(fonts/zh900.ttf); }
  @font-face { font-family: "Cap"; font-weight: 700; src: url(fonts/zh700.ttf); }
  @font-face { font-family: "Pix"; src: url(fonts/pix.ttf); }
  html, body { margin: 0; background: #12121f; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Cap", sans-serif; }
  canvas { position: absolute; left: 0; top: 0; }
  .ov { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; }

  #scrim { height: 620px; background: linear-gradient(to bottom, rgba(18,18,31,.92) 0%, rgba(18,18,31,.78) 45%, rgba(18,18,31,0) 100%); }
  #brand { top: 150px; display: flex; justify-content: center; align-items: center; gap: 16px;
           font-family: "Pix"; font-size: 24px; color: #fff; letter-spacing: .08em;
           text-shadow: 0 3px 0 rgba(18,18,31,.75); }
  #brand svg { display: block; }

  #cap { top: 232px; text-align: center; }
  #cap .zh { font-weight: 900; font-size: 82px; line-height: 1.16; color: #fff; letter-spacing: .02em;
             -webkit-text-stroke: 12px #12121f; paint-order: stroke fill; }
  #cap .en { margin-top: 14px; font-weight: 700; font-size: 38px; color: #ffc02b; letter-spacing: .01em;
             -webkit-text-stroke: 8px #12121f; paint-order: stroke fill; }

  .tag { position: absolute; transform-origin: 50% 100%; text-align: center; white-space: nowrap; }
  .tag .pill { display: inline-block; padding: 10px 34px 14px; border: 6px solid #12121f;
               box-shadow: 8px 8px 0 #12121f; font-weight: 900; font-size: 76px; line-height: 1.1; }
  .tag .pill small { display: block; font-family: "Pix"; font-size: 24px; letter-spacing: .12em; margin-top: 4px; }
  .tag.out .pill { background: #ef5f24; color: #fff; }
  .tag.in .pill { background: #fff; color: #12121f; }
  .tag .stem { width: 6px; height: 70px; margin: 0 auto; background: #12121f; }

  .dim { position: absolute; transform: translate(-50%, -50%); font-family: "Pix"; font-size: 30px; color: #fff;
         background: #12121f; padding: 10px 14px 8px; border: 4px solid #fff; white-space: nowrap; }

  /* English-only cut */
  .en #cap .zh { font-size: 68px; letter-spacing: 0; max-width: 940px; margin: 0 auto; text-wrap: balance; }
  .en .tag .pill { font-family: "Pix"; font-size: 54px; letter-spacing: .08em; padding: 22px 34px 16px; }
  .en #end .name { display: none; }
  .en #end .pix { font-size: 76px; margin-top: 64px; }
  .en #end .slo { font-size: 54px; letter-spacing: 0; }

  #end { height: 100%; background: #ffc02b; display: flex; flex-direction: column; align-items: center;
         justify-content: center; text-align: center; color: #12121f; }
  #end .name { font-weight: 900; font-size: 128px; letter-spacing: .06em; margin-top: 56px; line-height: 1.1; }
  #end .pix { font-family: "Pix"; font-size: 44px; letter-spacing: .08em; margin-top: 22px; }
  #end .slo { font-weight: 900; font-size: 62px; margin-top: 96px; letter-spacing: .04em; }
  #end .sle { font-weight: 700; font-size: 38px; margin-top: 16px; }
  #end .url { font-family: "Pix"; font-size: 30px; margin-top: 96px; background: #12121f; color: #ffc02b;
              padding: 22px 30px 18px; letter-spacing: .06em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>

  <div id="scrim" class="ov"></div>
  <div id="brand" class="ov">
    <svg viewBox="0 0 32 32" width="44" height="44" shape-rendering="crispEdges">
      <rect width="32" height="32" fill="#ffc02b"/><rect x="8" y="4" width="16" height="8" fill="#fff"/>
      <rect x="8" y="20" width="16" height="8" fill="#fff"/>
    </svg>
    <span>BULLEYBALL</span>
  </div>

  <div id="cap" class="ov"><div class="zh"></div><div class="en"></div></div>
  <div id="tags" class="ov" style="height:100%"></div>
  <div id="dim" class="dim">3 m</div>

  <div id="end" class="ov">
    <svg id="endmark" viewBox="0 0 32 32" width="380" height="380" shape-rendering="crispEdges">
      <rect width="32" height="32" fill="#ffc02b"/><rect x="8" y="4" width="16" height="8" fill="#fff"/>
      <rect x="8" y="20" width="16" height="8" fill="#fff"/>
    </svg>
    <div class="name">鬥牛排球</div>
    <div class="pix">BULLEYBALL</div>
    <div class="slo"></div>
    <div class="sle"></div>
    <div class="url"></div>
  </div>
</div>

<script type="module">
import * as THREE from "./node_modules/three/build/three.module.js";
import * as SIM from "./sim.js";
import * as SCR from "./script.js";

/* fonts first: the arena boards draw text into a canvas while the scene is built */
await document.fonts.load('900 40px "Cap"', "鬥牛排球"); await document.fonts.load('700 40px "Cap"', "abc");
await document.fonts.load('40px "Pix"', "ABC"); await document.fonts.ready;

const W = 1080, H = 1920;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const { lerp, clamp, smooth } = SIM;
const ease = u => { u = clamp(u, 0, 1); return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };

/* ------------------------------------------------------------ renderer */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12121f);
scene.fog = new THREE.Fog(0x12121f, 34, 78);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);

/* ------------------------------------------------------------ palette */
const C = {
  floor: 0x171827, apron: 0x23264a, back: 0xf6f1e6, front: 0xffc02b, line: 0xffffff,
  skin: 0xe9e5df, shorts: 0x1b1c30, shoe: 0xf4f4f4,
  A: 0xef5f24, B: 0x2f7fd6, out: 0xef5f24, post: 0xd9dce8
};
const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.62, metalness: 0 }, o));

/* ------------------------------------------------------------ lights */
scene.add(new THREE.HemisphereLight(0xdfe4ff, 0x4a4030, 1.25));
const key = new THREE.DirectionalLight(0xfff3df, 2.7);
key.position.set(7, 17, 6.5);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -15, right: 15, top: 10, bottom: -10, near: 1, far: 45 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.025; key.shadow.radius = 5;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xa9bcff, 0.55);
fill.position.set(-9, 7, -8); scene.add(fill);

/* ------------------------------------------------------------ court */
function slab(x0, x1, z0, z1, y, color, o) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), mat(color, Object.assign({ roughness: 0.78 }, o)));
  m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
  m.receiveShadow = true; scene.add(m); return m;
}
const { COURT_X: CX, COURT_Z: CZ, ZONE, NET_TOP, NET_BOT, BALL_R } = SIM;
slab(-70, 70, -70, 70, 0, C.floor, { roughness: 0.9 });
slab(-CX - 5, CX + 5, -CZ - 4, CZ + 4, 0.002, C.apron);
slab(-CX, -ZONE, -CZ, CZ, 0.004, C.back);       /* in  */
slab(ZONE, CX, -CZ, CZ, 0.004, C.back);         /* in  */
slab(-ZONE, ZONE, -CZ, CZ, 0.004, C.front);     /* out */
const LW = 0.05;
[[-CX, CX, -CZ, -CZ + LW], [-CX, CX, CZ - LW, CZ], [-CX, -CX + LW, -CZ, CZ], [CX - LW, CX, -CZ, CZ],
 [-ZONE - LW / 2, -ZONE + LW / 2, -CZ, CZ], [ZONE - LW / 2, ZONE + LW / 2, -CZ, CZ], [-LW / 2, LW / 2, -CZ, CZ]]
  .forEach(r => slab(r[0], r[1], r[2], r[3], 0.006, C.line, { roughness: 0.5 }));

/* overlays the reveals switch on */
function glow(x0, x1, color) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, CZ * 2),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, 0.009, 0); scene.add(m); return m;
}
const glowB = glow(0, ZONE, C.out), glowA = glow(-ZONE, 0, 0xffffff);
function ringMesh(color) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.82, 1, 64),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.012; scene.add(m); return m;
}
const rings = [ringMesh(0x12121f), ringMesh(0x12121f)];
/* 3 m dimension bar, laid outside the sideline */
const dimBar = new THREE.Group();
[[1.5, 0, 3, 0.06], [0, 0, 0.06, 0.5], [3, 0, 0.06, 0.5]].forEach(b => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(b[2], b[3]), new THREE.MeshBasicMaterial({ color: 0x12121f }));
  m.rotation.x = -Math.PI / 2; m.position.set(b[0], 0.01, b[1]); dimBar.add(m);
});
dimBar.visible = false; scene.add(dimBar);

/* ------------------------------------------------------------ net */
(function net() {
  const cv = document.createElement("canvas"); cv.width = cv.height = 64;
  const g = cv.getContext("2d"); g.clearRect(0, 0, 64, 64); g.strokeStyle = "#7d819e"; g.lineWidth = 6;
  g.strokeRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(100, 10);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(10, NET_TOP - NET_BOT),
    new THREE.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, roughness: 0.9 }));
  mesh.rotation.y = Math.PI / 2; mesh.position.set(0, (NET_TOP + NET_BOT) / 2, 0); scene.add(mesh);
  const band = (y, h, z0, z1, color) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.025, h, z1 - z0), mat(color, { roughness: 0.6 }));
    b.position.set(0, y, (z0 + z1) / 2); b.castShadow = true; scene.add(b);
  };
  band(NET_TOP - 0.035, 0.07, -5, 5, 0xffffff);
  band(NET_BOT + 0.025, 0.05, -5, 5, 0xffffff);
  [-CZ, CZ].forEach(z => {
    band((NET_TOP + NET_BOT) / 2, NET_TOP - NET_BOT, z - 0.025, z + 0.025, 0xffffff);
    /* antenna: red and white, 80 cm above the tape */
    for (let i = 0; i < 9; i++) {
      const a = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.2, 8), mat(i % 2 ? 0xffffff : 0xe23b2e));
      a.position.set(0, NET_BOT + 0.1 + i * 0.2, z); scene.add(a);
    }
  });
  [-5.05, 5.05].forEach(z => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.55, 20), mat(C.post, { roughness: 0.35, metalness: 0.3 }));
    post.position.set(0, 1.275, z); post.castShadow = true; scene.add(post);
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 1.8, 20), mat(C.A, { roughness: 0.7 }));
    pad.position.set(0, 0.9, z); pad.castShadow = true; scene.add(pad);
  });
})();

/* ------------------------------------------------------------ arena */
(function arena() {
  const board = (() => {
    const cv = document.createElement("canvas"); cv.width = 2048; cv.height = 128;
    const g = cv.getContext("2d"); g.fillStyle = "#12121f"; g.fillRect(0, 0, 2048, 128);
    g.font = '44px "Pix"'; g.textBaseline = "middle"; g.fillStyle = "#ffc02b";
    for (let i = 0; i < 2; i++) {
      g.fillStyle = "#ffc02b"; g.fillRect(40 + i * 1024, 36, 56, 56);
      g.fillStyle = "#fff"; g.fillRect(54 + i * 1024, 43, 28, 14); g.fillRect(54 + i * 1024, 71, 28, 14);
      g.fillStyle = "#ffc02b"; g.fillText("BULLEYBALL", 130 + i * 1024, 68);
      g.fillStyle = "#fff"; g.font = '26px "Pix"'; g.fillText("bulleyball.club", 600 + i * 1024, 68); g.font = '44px "Pix"';
    }
    const t = new THREE.CanvasTexture(cv); t.wrapS = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    return t;
  })();
  const wall = (w, x, z, ry) => {
    const t = board.clone(); t.needsUpdate = true; t.repeat.set(w / 16, 1);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, 1.0), new THREE.MeshStandardMaterial({ map: t, roughness: 0.6 }));
    m.position.set(x, 0.5, z); m.rotation.y = ry; scene.add(m);
  };
  wall(34, 0, -10.2, 0); wall(34, 0, 10.2, Math.PI); wall(20.4, -17, 0, Math.PI / 2); wall(20.4, 17, 0, -Math.PI / 2);
  /* tiered stands: dark steps with rows of seat backs */
  const seatGeo = new THREE.BoxGeometry(0.46, 0.42, 0.1);
  const seats = new THREE.InstancedMesh(seatGeo, mat(0x2b2f52, { roughness: 0.85 }), 9000);
  let n = 0; const M = new THREE.Matrix4();
  const tier = (len, cx, cz, ry) => {
    for (let i = 0; i < 11; i++) {
      const d = 0.6 + i * 0.95, y = 0.55 + i * 0.5;
      const step = new THREE.Mesh(new THREE.BoxGeometry(len + i * 1.9, 0.5, 0.95), mat(i % 2 ? 0x1b1d33 : 0x202340, { roughness: 0.95 }));
      const g = new THREE.Group(); g.position.set(cx, 0, cz); g.rotation.y = ry; scene.add(g);
      step.position.set(0, y, -d); g.add(step);
      const count = Math.floor((len + i * 1.9) / 0.62);
      for (let k = 0; k < count && n < 9000; k++) {
        const p = V((k - count / 2 + 0.5) * 0.62, y + 0.46, -d - 0.25).applyAxisAngle(UP, ry).add(V(cx, 0, cz));
        M.makeRotationY(ry); M.setPosition(p); seats.setMatrixAt(n++, M);
      }
    }
  };
  tier(34, 0, -10.3, 0); tier(34, 0, 10.3, Math.PI); tier(20.6, -17.1, 0, Math.PI / 2); tier(20.6, 17.1, 0, -Math.PI / 2);
  seats.count = n; scene.add(seats);
})();

/* ------------------------------------------------------------ ball */
const ball = (() => {
  const cv = document.createElement("canvas"); cv.width = 512; cv.height = 256;
  const g = cv.getContext("2d"); g.fillStyle = "#fbfaf6"; g.fillRect(0, 0, 512, 256);
  const swoosh = (color, phase, width) => {
    g.strokeStyle = color; g.lineWidth = width; g.beginPath();
    for (let x = -10; x <= 522; x += 4) { const y = 128 + 74 * Math.sin((x / 512) * Math.PI * 4 + phase); x === -10 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
  };
  swoosh("#ffc02b", 0, 64); swoosh("#ef5f24", Math.PI, 40);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 40, 28), new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 }));
  m.castShadow = true; scene.add(m); return m;
})();

/* ------------------------------------------------------------ mannequin */
const D = { hip: 0.98, torso: 0.55, thigh: 0.47, shin: 0.47, ankle: 0.07, uarm: 0.33, farm: 0.30 };
const Y = V(0, 1, 0);
const SKIN = "#e9e5df";
function seg(mesh, a, b) {
  const d = b.clone().sub(a), len = d.length();
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(Y, d.normalize());
  mesh.scale.set(1, len, 1);
}
/* orient a group: x = right, y = up, front = -z */
function frame(group, origin, right, up) {
  const x = right.clone().normalize(), z = x.clone().cross(up).normalize(), y = z.clone().cross(x);
  group.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z)); group.position.copy(origin);
}
/* two-bone IK: where the middle joint goes, bending toward `hint` */
function ik(root, target, l1, l2, hint) {
  const d = target.clone().sub(root); let dist = d.length();
  const max = (l1 + l2) * 0.999;
  if (dist > max) { d.multiplyScalar(max / dist); dist = max; }
  const dir = d.clone().normalize();
  const a = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const perp = hint.clone().addScaledVector(dir, -hint.dot(dir));
  if (perp.lengthSq() < 1e-6) perp.set(0, 0, 1); perp.normalize();
  return { mid: root.clone().addScaledVector(dir, a).addScaledVector(perp, h), end: root.clone().add(d) };
}
const ACT = { serve: [0.8, 0.45], dig: [0.55, 0.4], set: [0.5, 0.35], dink: [0.65, 0.4], spike: [0.65, 0.45], block: [0.5, 0.45] };

/* a limb with some anatomy to it: [radius, position along the limb], start joint first */
function limb(profile) {
  const g = new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), 22);
  g.translate(0, -0.5, 0); return g;
}
const GEO = {
  uarm:   limb([[0.047, 0], [0.055, 0.12], [0.058, 0.32], [0.050, 0.7], [0.042, 1]]),
  farm:   limb([[0.041, 0], [0.049, 0.18], [0.045, 0.48], [0.034, 0.85], [0.030, 1]]),
  thigh:  limb([[0.086, 0], [0.097, 0.15], [0.093, 0.42], [0.074, 0.78], [0.058, 1]]),
  shin:   limb([[0.054, 0], [0.066, 0.2], [0.061, 0.42], [0.044, 0.76], [0.037, 1]]),
  shorts: limb([[0.102, 0], [0.110, 0.3], [0.106, 1]]),
  sock:   limb([[0.047, 0], [0.043, 1]]),
  neck:   limb([[0.053, 0], [0.045, 1]]),
  wrist:  limb([[0.037, 0], [0.035, 1]])
};
/* the trunk: elliptical sections from hips to the base of the neck.
   u runs once round the body with the seam under the left arm
   (front 0.75, right side 0.5, back 0.25), v from hips to neck.        */
const TORSO_H = 0.60;
const torsoGeo = (() => {
  const R = [[0.00, .150, .105], [0.10, .146, .100], [0.22, .134, .094], [0.36, .160, .112],
             [0.46, .178, .118], [0.53, .170, .098], [0.575, .098, .074], [0.60, .050, .050]];
  const N = 32, pos = [], uv = [], idx = [];
  R.forEach(([y, hw, hd]) => {
    for (let k = 0; k <= N; k++) {
      const th = 1.5 * Math.PI + 2 * Math.PI * k / N;
      pos.push(hw * Math.sin(th), y, -hd * Math.cos(th)); uv.push(1 - k / N, y / TORSO_H);
    }
  });
  for (let j = 0; j < R.length - 1; j++) for (let k = 0; k < N; k++) {
    const a = j * (N + 1) + k, b = a + 1, c = a + N + 1, d = c + 1; idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
})();
/* a beach-volleyball tank top, painted onto the trunk: cut-away armholes,
   scooped neck, racer back, number on both sides                        */
function tankTexture(color, num) {
  const cw = 1024, ch = 512, cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  const g = cv.getContext("2d"), X = u => u * cw, Yv = v => (1 - v) * ch;
  g.fillStyle = SKIN; g.fillRect(0, 0, cw, ch);
  g.fillStyle = color; g.fillRect(0, Yv(0.95), cw, ch);
  g.fillStyle = "rgba(0,0,0,.16)";                                   /* side panels */
  [0, 0.5, 1].forEach(u => g.fillRect(X(u - 0.035), Yv(0.62), X(0.07), ch));
  const cut = (u, v, ru, rv) => {
    g.beginPath(); g.ellipse(X(u), Yv(v), X(ru), rv * ch, 0, 0, 7);
    g.fillStyle = SKIN; g.fill(); g.strokeStyle = "#ffffff"; g.lineWidth = 9; g.stroke();
  };
  cut(0.75, 0.93, 0.062, 0.17);                                      /* neckline   */
  cut(0.25, 0.97, 0.045, 0.12);                                      /* back scoop */
  [0, 0.5, 1].forEach(u => cut(u, 0.93, 0.105, 0.26));               /* armholes   */
  g.fillStyle = SKIN; g.fillRect(0, 0, cw, Yv(0.955));
  g.fillStyle = "#ffffff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = '900 190px "Cap"'; g.fillText(num, X(0.25), Yv(0.42));
  g.font = '900 96px "Cap"';  g.fillText(num, X(0.75), Yv(0.50));
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

/* hair: everyone gets a cap of it, tilted back to leave a hairline, and
   then their own cut and colour, so the four are people rather than
   two pairs. Built in the head's frame: front is -z, up is +y.          */
const HAIR = {
  A1: { color: 0x1d1b22, style: "crop" },       /* black, short, a little lift at the front */
  A2: { color: 0xe6c468, style: "ponytail" },   /* blonde ponytail                           */
  B1: { color: 0x2fb36a, style: "crop" },       /* green, short                              */
  B2: { color: 0xd41f2c, style: "buzz" }        /* red buzz cut, after Sakuragi              */
};
const capGeo = new THREE.SphereGeometry(0.114, 30, 18, 0, Math.PI * 2, 0, Math.PI * 0.6);
const tailGeo = limb([[0.026, 0], [0.037, 0.28], [0.031, 0.7], [0.008, 1]]);

  glowB.material.opacity = r1 * (0.30 + 0.22 * Math.cos((ft - T.rev1[0]) * Math.PI * 2 * 1.1));
  glowA.material.opacity = r2 * (0.34 + 0.2 * Math.cos((ft - T.rev2[0]) * Math.PI * 2 * 1.1));
  const land = r1 > 0 ? [2.0, 0.8, T.rev1[0]] : r2 > 0 ? [-1.85, -0.4, T.rev2[0]] : null;
  rings.forEach((ring, i) => {
    if (!land) { ring.material.opacity = 0; return; }
    const u = (((ft - land[2]) / 1.1) + i * 0.5) % 1;
    ring.position.set(land[0], 0.012, land[1]); ring.scale.setScalar(0.22 + 1.05 * u);
    ring.material.opacity = Math.max(r1, r2) * (1 - u) * 0.9;
  });
  dimBar.visible = r1 > 0 || r2 > 0;
  if (r1 > 0) dimBar.position.set(0, 0, -0.75); else if (r2 > 0) dimBar.position.set(-3, 0, 1.15);

  renderer.render(scene, camera);

  /* captions */
  let cap = null; for (const k of SCR.CAPTIONS) if (ft >= k[0] && ft < k[1]) cap = k;
  if (cap) {
    const o = fadeIO(ft, cap[0], cap[1], 0.2);
    if (EN) { capZh.textContent = cap[3]; capEn.textContent = ""; }
    else { capZh.innerHTML = cap[2].length > 11 ? cap[2].replace("，", "<br>") : cap[2]; capEn.textContent = cap[3]; }
    capBox.style.opacity = o; capBox.style.transform = `translateY(${(1 - smooth(clamp((ft - cap[0]) / 0.3, 0, 1))) * 26}px)`;
  } else capBox.style.opacity = 0;

  SCR.TAGS.forEach((t, i) => {
    const e = tagEls[i], on = ft >= t[0] && ft < t[1];
    if (!on) { e.style.opacity = 0; return; }
    const [x, y] = project(t[2]); const u = clamp((ft - t[0]) / 0.28, 0, 1);
    const pop = u < 1 ? 1 + 0.28 * Math.sin(u * Math.PI) - (1 - u) * 0.6 : 1;
    e.style.opacity = fadeIO(ft, t[0], t[1], 0.15);
    e.style.left = x + "px"; e.style.top = y + "px";
    e.style.transform = `translate(-50%, -100%) scale(${pop})`;
  });
  if (dimBar.visible) {
    const [x, y] = project([dimBar.position.x + 1.5, 0, dimBar.position.z]);
    dimEl.style.opacity = Math.max(r1, r2); dimEl.style.left = x + "px"; dimEl.style.top = y + "px";
  } else dimEl.style.opacity = 0;

  /* end card */
  const ec = SCR.END_CARD, e = clamp((ft - ec.from) / 0.7, 0, 1);
  endEl.style.opacity = smooth(e);
  $("#brand").style.opacity = 1 - smooth(e);
  const stag = (sel, at) => { const u = smooth(clamp((ft - ec.from - at) / 0.45, 0, 1)); const el = $(sel);
    el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * 34}px)`; };
  $("#endmark").style.transform = `scale(${lerp(1.5, 1, smooth(clamp((ft - ec.from) / 0.9, 0, 1)))})`;
  stag("#end .name", 0.4); stag("#end .pix", 0.55); stag("#end .slo", 0.8); stag("#end .sle", 0.95); stag("#end .url", 1.4);
  return st;
};

window.DURATION = SCR.DURATION; window.FPS = SCR.FPS;
window.renderFrame(0);
window.READY = true;
</script>
